name: news_app
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.2
  pretty_dio_logger: ^1.3.1

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # shared_preferences: ^2.2.1

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Connectivity
  connectivity_plus: ^7.1.0

  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  webview_flutter: ^4.4.1
  timeago: ^3.6.0
  flutter_staggered_animations: ^1.1.1

  # Environment / Security
  flutter_dotenv: ^5.1.0

  # Utils
  dartz: ^0.10.1
  rxdart: ^0.27.7
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  injectable_generator: ^2.4.1
  build_runner: ^2.4.7
  mocktail: ^1.0.1
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
